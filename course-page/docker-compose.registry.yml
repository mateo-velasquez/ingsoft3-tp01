services:
  database:
    image: ghcr.io/mateo-velasquez/course-page-database:v0.1.0
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 20s
      retries: 10
      start_period: 30s

  backend:
    image: ghcr.io/mateo-velasquez/course-page-backend:v0.1.0
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    image: ghcr.io/mateo-velasquez/course-page-frontend:v0.1.0
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pg_data:
