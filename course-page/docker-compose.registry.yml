services:
  database:
    image: ghcr.io/mateo-velasquez/course-page-database:v0.1.0
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_TCP_PORT: ${MYSQL_TCP_PORT}
    ports:
      - "${MYSQL_TCP_PORT}:${MYSQL_TCP_PORT}"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -P \"$$MYSQL_TCP_PORT\" -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 20s
      retries: 10
      start_period: 30s

  backend:
    image: ghcr.io/mateo-velasquez/course-page-backend:v0.1.0
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    image: ghcr.io/mateo-velasquez/course-page-frontend:v0.1.0
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db_data:
