name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la etapa de tests del backend
        uses: docker/build-push-action@v7
        with:
          context: ./course-page/backend
          target: test
          load: true
          push: false
          tags: backend-test:ci
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,mode=max,scope=backend-test

      - name: Correr los tests del backend con coverage
        run: |
          docker run --rm -e COVERAGE_DIR=/out \
            -v "${{ github.workspace }}/backend-coverage:/out" backend-test:ci

      - name: Resumen del coverage del backend
        if: ${{ !cancelled() }}
        run: |
          test -f backend-coverage/summary.md
          cat backend-coverage/summary.md >> $GITHUB_STEP_SUMMARY

      - name: Publicar el coverage del backend
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: coverage-backend
          path: |
            backend-coverage/coverage.html
            backend-coverage/coverage.out
            backend-coverage/coverage-func.txt
            backend-coverage/summary.md

      # Último paso a propósito: si los tests fallan, el job muere antes y no se publica nada.
      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del backend
        uses: docker/build-push-action@v7
        with:
          context: ./course-page/backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}-backend:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la etapa de tests del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./course-page/frontend
          target: test
          load: true
          push: false
          tags: frontend-test:ci
          cache-from: type=gha,scope=frontend-test
          cache-to: type=gha,mode=max,scope=frontend-test

      - name: Correr los tests del frontend con coverage
        run: |
          docker run --rm -e COVERAGE_DIR=/salida/reporte \
            -v "${{ github.workspace }}/frontend-coverage:/salida" frontend-test:ci

      - name: Resumen del coverage del frontend
        if: ${{ !cancelled() }}
        run: |
          F=frontend-coverage/reporte/coverage-summary.json
          test -f "$F"          # si no está, el paso FALLA: mejor rojo que un resumen vacío
          if [ "$(jq '.total.lines.total' "$F")" = "0" ]; then
            echo "midió 0 archivos: revisá el include de vite.config.js"
            exit 1
          fi
          {
            echo "### Coverage del frontend"
            echo
            echo "| métrica | % |"
            echo "|---|---|"
            jq -r '.total | "| statements | \(.statements.pct)% |", "| branches | \(.branches.pct)% |", "| functions | \(.functions.pct)% |", "| lines | \(.lines.pct)% |"' "$F"
          } >> $GITHUB_STEP_SUMMARY

      - name: Publicar el coverage del frontend
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: coverage-frontend
          path: frontend-coverage

      # Último paso a propósito: si los tests fallan, el job muere antes y no se publica nada.
      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./course-page/frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # La promoción arranca donde termina la verificación.
  deploy-qa:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]   # sin CI verde no hay deploy
    if: github.ref == 'refs/heads/main'      # los PRs verifican; sólo main despliega
    environment:
      name: qa                               # hereda los secrets del environment (los hooks)
      url: https://course-page-front-qa.onrender.com
    # Dos merges seguidos: el segundo deploy espera a que termine el primero en vez de
    # pisarlo a mitad de camino (y dejar al smoke del primero esperando un commit que ya no va a llegar).
    concurrency:
      group: deploy-qa
      cancel-in-progress: false
    env:
      URL_API: https://course-page-api-qa.onrender.com
      URL_FRONT: https://course-page-front-qa.onrender.com
    steps:
      # El &ref= hace que Render despliegue ESTE commit (el que se acaba de verificar) y no
      # la punta de main, que entre tanto pudo cambiar. Va & y no ? porque el hook ya trae ?key=.
      # Ojo: Render VUELVE A CONSTRUIR ese commit; no despliega la imagen verificada (eso es el TP7).
      - name: Disparar el deploy en Render (api + front) del commit verificado
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_QA }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_QA }}
        run: |
          curl -fsS --max-time 30 "$HOOK_API&ref=$GITHUB_SHA" > /dev/null
          curl -fsS --max-time 30 "$HOOK_FRONT&ref=$GITHUB_SHA" > /dev/null

      # Render responde al hook al instante y construye en segundo plano, sirviendo la versión
      # vieja mientras tanto: por eso no alcanza con que /health conteste, tiene que contestar
      # ESTE commit. Reintenta porque el free tier suma build + cold start.
      - name: Smoke test (espera a que QA corra el commit verificado)
        run: |
          echo "Esperando a que QA corra $GITHUB_SHA..."
          for i in $(seq 1 30); do
            # --max-time en cada curl: un servicio despertando acepta la conexión y no contesta.
            COMMIT=$(curl -fsS --max-time 10 "$URL_API/health" | jq -r .commit || true)
            if [ "$COMMIT" = "$GITHUB_SHA" ] \
               && curl -fsS --max-time 10 "$URL_API/courses" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/api/health" > /dev/null; then
              echo "✅ QA responde con $GITHUB_SHA (api + BD + front + proxy del front)"
              exit 0
            fi
            echo "Intento $i: la api corre '${COMMIT:-sin respuesta}', todavía no es el commit verificado"
            sleep 20
          done
          echo "❌ QA no corre $GITHUB_SHA después de 10 minutos"
          exit 1

  # El mismo commit, un escalón más arriba: sólo si QA quedó vivo y alguien lo aprueba.
  deploy-prod:
    runs-on: ubuntu-latest
    needs: [deploy-qa]                       # sin QA verde no hay PROD (en un PR, deploy-qa se saltea y éste también)
    environment:
      name: production                       # ⏸ el job SE PAUSA acá hasta que el required reviewer apruebe
      url: https://course-page-front-prod.onrender.com
    # Si entra otro merge mientras éste espera aprobación, el nuevo espera su turno: nunca
    # dos deploys a PROD a la vez.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    env:
      URL_API: https://course-page-api-prod.onrender.com
      URL_FRONT: https://course-page-front-prod.onrender.com
    steps:
      # Acá el &ref= importa más que en QA: entre la pausa y la aprobación pueden pasar horas y
      # main se mueve. Sin él, se aprueba el commit A y a PROD sube lo último que haya.
      # Estos secrets viven en el environment production: sin aprobación, no los lee nadie.
      - name: Disparar el deploy en Render (api + front) del commit aprobado
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_PROD }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_PROD }}
        run: |
          curl -fsS --max-time 30 "$HOOK_API&ref=$GITHUB_SHA" > /dev/null
          curl -fsS --max-time 30 "$HOOK_FRONT&ref=$GITHUB_SHA" > /dev/null

      # El mismo smoke que QA, contra PROD: tiene que contestar ESTE commit, no el anterior.
      - name: Smoke test (espera a que PROD corra el commit aprobado)
        run: |
          echo "Esperando a que PROD corra $GITHUB_SHA..."
          for i in $(seq 1 30); do
            COMMIT=$(curl -fsS --max-time 10 "$URL_API/health" | jq -r .commit || true)
            if [ "$COMMIT" = "$GITHUB_SHA" ] \
               && curl -fsS --max-time 10 "$URL_API/courses" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/api/health" > /dev/null; then
              echo "✅ PROD responde con $GITHUB_SHA (api + BD + front + proxy del front)"
              exit 0
            fi
            echo "Intento $i: la api corre '${COMMIT:-sin respuesta}', todavía no es el commit aprobado"
            sleep 20
          done
          echo "❌ PROD no corre $GITHUB_SHA después de 10 minutos"
          exit 1
